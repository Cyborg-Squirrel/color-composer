micronaut:
  application:
    name: color-composer
  data:
    save-as-insert: true
  http:
    client:
      ws:
        compression:
          enabled: false # Default is true, results in NoClassDefFoundError: com/jcraft/jzlib/Deflater
          configurations:
            web:
              allowed-origins-regex: ".*"
  server:
    cors:
      enabled: true

datasources:
  default:
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration/postgres