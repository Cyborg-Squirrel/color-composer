micronaut:
  application:
    name: color-composer
  http:
    client:
      ws:
        compression:
          enabled: false # Default is true, results in NoClassDefFoundError: com/jcraft/jzlib/Deflater
  server:
    cors:
      enabled: true

datasources:
  default:
    db-type: postgres
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true
      locations: classpath:db/migration/postgres

test-resources:
  containers:
    postgres:
      image-name: postgres:16-alpine